[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-psychophysics-subset"
version = "0.4.0"
description = "API evaluation for the frozen 1480-video visual psychophysics subset"
requires-python = ">=3.11"
dependencies = ["huggingface-hub>=1.0", "hf-xet>=1.1", "av>=14", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
# Compatibility with installation commands distributed before the API-only release.
download = []
frames = ["av>=14", "numpy>=1.26", "pillow>=10"]
test = ["pytest>=8", "av>=14", "numpy>=1.26", "pillow>=10"]

[project.scripts]
model-api = "vlm_psychophysics.api.cli:main"
psychophysics = "vlm_psychophysics.cli:main"

[tool.setuptools.packages.find]
include = ["vlm_psychophysics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
