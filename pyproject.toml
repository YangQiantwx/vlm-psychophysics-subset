[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-psychophysics-subset"
version = "0.2.0"
description = "Frozen 1480-trial visual psychophysics subset and reproducible evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "av>=14",
    "matplotlib>=3.8",
    "pillow>=10",
    "opencv-python-headless>=4.8",
]

